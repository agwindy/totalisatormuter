<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPBU 34-17603</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:#eef4ff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
}

.container{
  width:100%;
  max-width:430px;
}

.header{
  margin-bottom:18px;
}

.header h1{
  font-size:30px;
  color:#0f172a;
  font-weight:800;
}

.header p{
  color:#64748b;
  margin-top:4px;
  font-size:14px;
}

.card{
  background:white;
  border-radius:26px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 8px 24px rgba(15,23,42,0.06);
  border:1px solid #e2e8f0;
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.card-title h2{
  font-size:20px;
  color:#0f172a;
}

.action-group{
  display:flex;
  gap:8px;
}

.icon-btn{
  border:none;
  background:#2563eb;
  color:white;
  width:40px;
  height:40px;
  border-radius:14px;
  cursor:pointer;
  font-size:15px;
  transition:0.2s;
}

.icon-btn:hover{
  transform:scale(1.05);
}

.input-group{
  margin-bottom:14px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:600;
  color:#334155;
}

input{
  width:100%;
  border:none;
  background:#f8fbff;
  padding:15px;
  border-radius:18px;
  font-size:16px;
  outline:none;
  border:1px solid transparent;
  transition:0.2s;
}

input:focus{
  border:1px solid #2563eb;
  background:white;
  box-shadow:0 0 0 4px rgba(37,99,235,0.08);
}

.result{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  border-radius:28px;
  padding:24px;
  text-align:center;
  margin-top:10px;
  box-shadow:0 10px 24px rgba(37,99,235,0.2);
}

.result h3{
  font-size:14px;
  opacity:0.9;
  margin-bottom:10px;
  font-weight:400;
}

.result p{
  font-size:36px;
  font-weight:800;
}

.footer{
  text-align:center;
  margin-top:12px;
  color:#94a3b8;
  font-size:12px;
}

@media(max-width:480px){
  .result p{
    font-size:30px;
  }
}
</style>
</head>
<body>

<div class="container">

<div class="header">
  <h1>SPBU 34-17603</h1>
  <p>Totalisator Pertalite A1 & A2</p>
</div>

<div class="card">

  <div class="card-title">
    <h2>Mesin A1</h2>

    <div class="action-group">
      <button class="icon-btn" onclick="toggleLock('a1')" id="lockA1">🔒</button>
      <button class="icon-btn" onclick="copyMesin('a1')">📋</button>
    </div>
  </div>

  <div class="input-group">
    <label>Totalisator Awal</label>
    <input type="number" id="awalA1" oninput="hitung()" placeholder="Masukkan angka">
  </div>

  <div class="input-group">
    <label>Totalisator Akhir</label>
    <input type="number" id="akhirA1" oninput="hitung()" placeholder="Masukkan angka">
  </div>

</div>

<div class="card">

  <div class="card-title">
    <h2>Mesin A2</h2>

    <div class="action-group">
      <button class="icon-btn" onclick="toggleLock('a2')" id="lockA2">🔒</button>
      <button class="icon-btn" onclick="copyMesin('a2')">📋</button>
    </div>
  </div>

  <div class="input-group">
    <label>Totalisator Awal</label>
    <input type="number" id="awalA2" oninput="hitung()" placeholder="Masukkan angka">
  </div>

  <div class="input-group">
    <label>Totalisator Akhir</label>
    <input type="number" id="akhirA2" oninput="hitung()" placeholder="Masukkan angka">
  </div>

</div>

<div class="result">
  <h3>Total Penjualan</h3>
  <p id="hasil">0</p>
</div>

<div class="footer">
  Modern Blue Elegant Design
</div>

</div>

<script>

function hitung(){

  let awalA1 = parseFloat(document.getElementById('awalA1').value) || 0;
  let akhirA1 = parseFloat(document.getElementById('akhirA1').value) || 0;

  let awalA2 = parseFloat(document.getElementById('awalA2').value) || 0;
  let akhirA2 = parseFloat(document.getElementById('akhirA2').value) || 0;

  let hasilA1 = akhirA1 - awalA1;
  let hasilA2 = akhirA2 - awalA2;

  let total = hasilA1 + hasilA2;

  document.getElementById('hasil').innerText = total.toLocaleString('id-ID');
}

let lockA1 = false;
let lockA2 = false;

function toggleLock(mesin){

  if(mesin === 'a1'){

    lockA1 = !lockA1;

    document.getElementById('awalA1').disabled = lockA1;
    document.getElementById('akhirA1').disabled = lockA1;

    document.getElementById('lockA1').innerText = lockA1 ? '🔓' : '🔒';
  }

  if(mesin === 'a2'){

    lockA2 = !lockA2;

    document.getElementById('awalA2').disabled = lockA2;
    document.getElementById('akhirA2').disabled = lockA2;

    document.getElementById('lockA2').innerText = lockA2 ? '🔓' : '🔒';
  }
}

function copyMesin(mesin){

  let text = '';

  if(mesin === 'a1'){

    let awal = document.getElementById('awalA1').value || 0;
    let akhir = document.getElementById('akhirA1').value || 0;

    text = 'Mesin A1\nTotal Awal : ' + awal + '\nTotal Akhir : ' + akhir;
  }

  if(mesin === 'a2'){

    let awal = document.getElementById('awalA2').value || 0;
    let akhir = document.getElementById('akhirA2').value || 0;

    text = 'Mesin A2\nTotal Awal : ' + awal + '\nTotal Akhir : ' + akhir;
  }

  navigator.clipboard.writeText(text)
  .then(()=>{
    alert('Data berhasil di copy');
  });
}

</script>

</body>
</html>
