<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPBU 34-17603 · Totalisator</title>

    <style>
        /* ─── Reset & Base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ─── Container ─── */
        .container {
            width: 100%;
            max-width: 440px;
        }

        /* ─── Header ─── */
        .app-header {
            background: linear-gradient(145deg, #0b1a2e, #14283e);
            border-radius: 28px;
            padding: 24px 28px 20px;
            margin-bottom: 22px;
            box-shadow: 0 12px 32px rgba(11, 26, 46, 0.25);
            position: relative;
            overflow: hidden;
        }

        .app-header::after {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.10) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            z-index: 1;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #0b1a2e;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.30);
        }

        .brand-text h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .brand-text .badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.20);
            color: #fbbf24;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-top: 2px;
            border: 1px solid rgba(245, 158, 11, 0.15);
        }

        .header-status {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 4px 14px 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.2px;
            backdrop-filter: blur(4px);
            position: relative;
            z-index: 1;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        .header-sub {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 400;
            margin-top: 6px;
            position: relative;
            z-index: 1;
            letter-spacing: 0.2px;
        }

        .header-sub span {
            color: #fbbf24;
            font-weight: 500;
        }

        /* ─── Card ─── */
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 22px 22px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            border: 1px solid #e9edf2;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .card:hover {
            border-color: #dce1e9;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .machine-badge {
            font-size: 13px;
            font-weight: 700;
            color: #0b1a2e;
            background: #f1f5f9;
            padding: 2px 12px;
            border-radius: 30px;
            letter-spacing: -0.2px;
        }

        .machine-badge.highlight {
            background: #fef3c7;
            color: #b45309;
        }

        .card-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #0b1a2e;
            letter-spacing: -0.2px;
        }

        .card-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            border: none;
            background: transparent;
            color: #64748b;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: 1px solid transparent;
        }

        .icon-btn:hover {
            background: #f1f5f9;
            color: #0b1a2e;
            transform: translateY(-1px);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .icon-btn.lock-active {
            background: #fef3c7;
            color: #b45309;
            border-color: #fcd34d;
        }

        .icon-btn.copy-btn:hover {
            background: #dbeafe;
            color: #2563eb;
        }

        .icon-btn.reset-btn:hover {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* ─── Input Group ─── */
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .input-group label .label-left {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-group label .label-icon {
            font-size: 13px;
            opacity: 0.6;
        }

        /* ─── Scan (foto) button ─── */
        .scan-btn {
            border: none;
            background: #eef2ff;
            color: #4338ca;
            width: 22px;
            height: 22px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s ease;
            flex-shrink: 0;
        }

        .scan-btn:hover {
            background: #e0e7ff;
            transform: translateY(-1px);
        }

        .scan-btn:active {
            transform: scale(0.92);
        }

        .scan-btn.scanning {
            animation: scan-pulse 1s infinite;
            background: #fef3c7;
            color: #b45309;
            cursor: wait;
        }

        @keyframes scan-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .input-wrap {
            position: relative;
        }

        .input-group input {
            width: 100%;
            border: 1.5px solid #e2e8f0;
            background: #fafcff;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            color: #0b1a2e;
            outline: none;
            transition: 0.2s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.2px;
        }

        .input-group input::placeholder {
            color: #b3c0d0;
            font-weight: 400;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.07);
        }

        .input-group input:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            border-color: #e2e8f0;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .input-group input:disabled::placeholder {
            color: #cbd5e1;
        }

        .input-group input.just-filled {
            border-color: #22c55e;
            background: #f0fdf4;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.10);
        }

        /* ─── Result Card ─── */
        .result-card {
            background: linear-gradient(145deg, #0b1a2e, #14283e);
            border-radius: 24px;
            padding: 24px 22px 22px;
            margin-top: 6px;
            box-shadow: 0 12px 32px rgba(11, 26, 46, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .result-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .result-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-left .icon-wrap {
            width: 36px;
            height: 36px;
            background: rgba(245, 158, 11, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .result-left h3 {
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .result-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .result-unit {
            font-size: 12px;
            font-weight: 500;
            color: #64748b;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.3px;
        }

        .reset-icon-btn {
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .reset-icon-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.2);
            transform: rotate(30deg) scale(1.05);
        }

        .reset-icon-btn:active {
            transform: rotate(60deg) scale(0.95);
        }

        .result-value-wrap {
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }

        .result-value-wrap p {
            font-size: 44px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            line-height: 1.1;
            font-family: 'Inter', sans-serif;
        }

        .result-value-wrap p .decimal {
            font-size: 28px;
            font-weight: 600;
            color: #94a3b8;
        }

        .result-footer {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .result-footer span {
            font-size: 12px;
            color: #64748b;
            font-weight: 400;
        }

        .result-footer .highlight-text {
            color: #fbbf24;
            font-weight: 500;
        }

        /* ─── Toast Notification ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #0b1a2e;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: calc(100% - 40px);
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .toast-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ─── Footer ─── */
        .app-footer {
            text-align: center;
            margin-top: 18px;
            padding: 6px 0 2px;
        }

        .app-footer p {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .app-footer p span {
            color: #64748b;
            font-weight: 500;
        }

        /* ─── Responsive ─── */
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }

            .app-header {
                padding: 20px 18px 16px;
                border-radius: 22px;
            }

            .brand-text h1 {
                font-size: 19px;
            }

            .brand-icon {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }

            .header-status {
                font-size: 10px;
                padding: 3px 10px 3px 8px;
            }

            .card {
                padding: 16px 16px 18px;
                border-radius: 20px;
            }

            .input-row {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .input-group input {
                padding: 11px 12px;
                font-size: 15px;
                border-radius: 12px;
            }

            .result-value-wrap p {
                font-size: 34px;
            }

            .result-value-wrap p .decimal {
                font-size: 22px;
            }

            .result-card {
                padding: 18px 16px 16px;
                border-radius: 20px;
            }

            .result-left h3 {
                font-size: 11px;
            }

            .result-unit {
                font-size: 10px;
                padding: 3px 10px;
            }

            .reset-icon-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }

            .toast {
                font-size: 13px;
                padding: 10px 20px;
                bottom: 20px;
                width: calc(100% - 40px);
                justify-content: center;
            }
        }

        @media (max-width: 380px) {
            .input-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .header-top {
                flex-direction: column;
                gap: 12px;
            }

            .header-status {
                align-self: flex-start;
            }

            .brand-text h1 {
                font-size: 18px;
            }

            .result-value-wrap p {
                font-size: 30px;
            }
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* ─── Utility ─── */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ═══ HEADER ═══ -->
        <header class="app-header">
            <div class="header-top">
                <div class="header-brand">
                    <div class="brand-icon" aria-hidden="true">⛽</div>
                    <div class="brand-text">
                        <h1>SPBU 34-17603</h1>
                        <div class="badge">Totalisator</div>
                    </div>
                </div>
                <div class="header-status">
                    <span class="status-dot" aria-hidden="true"></span>
                    Online
                </div>
            </div>
            <div class="header-sub">
                Pertalite &nbsp;·&nbsp; <span>A1</span> &amp; <span>A2</span> &nbsp;·&nbsp; <span>📷 Scan Foto</span>
            </div>
        </header>

        <!-- ═══ MESIN A1 ═══ -->
        <section class="card" aria-label="Mesin A1">
            <div class="card-header">
                <div class="card-header-left">
                    <span class="machine-badge highlight">A1</span>
                    <h2>Mesin A1</h2>
                </div>
                <div class="card-actions">
                    <button class="icon-btn lock-btn" id="lockA1" onclick="toggleLock('a1')" aria-label="Kunci totalisator A1">
                        🔒
                    </button>
                    <button class="icon-btn copy-btn" onclick="copyMesin('a1')" aria-label="Salin data A1">
                        📋
                    </button>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="awalA1">
                        <span class="label-left"><span class="label-icon" aria-hidden="true">◀</span> Awal</span>
                        <button type="button" class="scan-btn" id="scanBtn-awalA1" onclick="triggerScan('awalA1')" aria-label="Scan foto angka awal A1" title="Ambil foto / upload">📷</button>
                    </label>
                    <div class="input-wrap">
                        <input type="number" id="awalA1" oninput="hitung()" placeholder="0" step="1" min="0" />
                    </div>
                    <input type="file" accept="image/*" capture="environment" class="sr-only" id="fileInput-awalA1" onchange="handleFotoScan(event,'awalA1')" />
                </div>
                <div class="input-group">
                    <label for="akhirA1">
                        <span class="label-left"><span class="label-icon" aria-hidden="true">▶</span> Akhir</span>
                        <button type="button" class="scan-btn" id="scanBtn-akhirA1" onclick="triggerScan('akhirA1')" aria-label="Scan foto angka akhir A1" title="Ambil foto / upload">📷</button>
                    </label>
                    <div class="input-wrap">
                        <input type="number" id="akhirA1" oninput="hitung()" placeholder="0" step="1" min="0" />
                    </div>
                    <input type="file" accept="image/*" capture="environment" class="sr-only" id="fileInput-akhirA1" onchange="handleFotoScan(event,'akhirA1')" />
                </div>
            </div>
        </section>

        <!-- ═══ MESIN A2 ═══ -->
        <section class="card" aria-label="Mesin A2">
            <div class="card-header">
                <div class="card-header-left">
                    <span class="machine-badge">A2</span>
                    <h2>Mesin A2</h2>
                </div>
                <div class="card-actions">
                    <button class="icon-btn lock-btn" id="lockA2" onclick="toggleLock('a2')" aria-label="Kunci totalisator A2">
                        🔒
                    </button>
                    <button class="icon-btn copy-btn" onclick="copyMesin('a2')" aria-label="Salin data A2">
                        📋
                    </button>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="awalA2">
                        <span class="label-left"><span class="label-icon" aria-hidden="true">◀</span> Awal</span>
                        <button type="button" class="scan-btn" id="scanBtn-awalA2" onclick="triggerScan('awalA2')" aria-label="Scan foto angka awal A2" title="Ambil foto / upload">📷</button>
                    </label>
                    <div class="input-wrap">
                        <input type="number" id="awalA2" oninput="hitung()" placeholder="0" step="1" min="0" />
                    </div>
                    <input type="file" accept="image/*" capture="environment" class="sr-only" id="fileInput-awalA2" onchange="handleFotoScan(event,'awalA2')" />
                </div>
                <div class="input-group">
                    <label for="akhirA2">
                        <span class="label-left"><span class="label-icon" aria-hidden="true">▶</span> Akhir</span>
                        <button type="button" class="scan-btn" id="scanBtn-akhirA2" onclick="triggerScan('akhirA2')" aria-label="Scan foto angka akhir A2" title="Ambil foto / upload">📷</button>
                    </label>
                    <div class="input-wrap">
                        <input type="number" id="akhirA2" oninput="hitung()" placeholder="0" step="1" min="0" />
                    </div>
                    <input type="file" accept="image/*" capture="environment" class="sr-only" id="fileInput-akhirA2" onchange="handleFotoScan(event,'akhirA2')" />
                </div>
            </div>
        </section>

        <!-- ═══ RESULT ═══ -->
        <div class="result-card">
            <div class="result-top">
                <div class="result-left">
                    <span class="icon-wrap" aria-hidden="true">📊</span>
                    <h3>Total Penjualan</h3>
                </div>
                <div class="result-actions">
                    <span class="result-unit">Liter</span>
                    <button class="reset-icon-btn" onclick="resetData()" aria-label="Reset semua totalisator" title="Reset semua nilai">
                        ↺
                    </button>
                </div>
            </div>
            <div class="result-value-wrap">
                <p id="hasil">0</p>
            </div>
            <div class="result-footer">
                <span>A1 + A2</span>
                <span class="highlight-text" id="detailResult">0 L</span>
            </div>
        </div>

        <!-- ═══ FOOTER ═══ -->
        <footer class="app-footer">
            <p>Made with <span>❤</span> by Ag Windy</p>
        </footer>

        <!-- ═══ TOAST ═══ -->
        <div class="toast" id="toast" role="alert" aria-live="polite">
            <span class="toast-icon" aria-hidden="true">✓</span>
            <span id="toastMessage">Data berhasil disalin</span>
        </div>

    </div>

    <script>
        // ─── State ───
        let lockA1 = false;
        let lockA2 = false;
        let toastTimer = null;

        // ─── DOM refs ───
        const elAwalA1 = document.getElementById('awalA1');
        const elAkhirA1 = document.getElementById('akhirA1');
        const elAwalA2 = document.getElementById('awalA2');
        const elAkhirA2 = document.getElementById('akhirA2');
        const elHasil = document.getElementById('hasil');
        const elDetail = document.getElementById('detailResult');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMessage');

        // ─── Hitung ───
        function hitung() {
            const awalA1 = parseFloat(elAwalA1.value) || 0;
            const akhirA1 = parseFloat(elAkhirA1.value) || 0;
            const awalA2 = parseFloat(elAwalA2.value) || 0;
            const akhirA2 = parseFloat(elAkhirA2.value) || 0;

            const hasilA1 = Math.max(0, akhirA1 - awalA1);
            const hasilA2 = Math.max(0, akhirA2 - awalA2);
            const total = hasilA1 + hasilA2;

            const formatter = new Intl.NumberFormat('id-ID');
            elHasil.textContent = formatter.format(total);

            const detailA1 = formatter.format(hasilA1);
            const detailA2 = formatter.format(hasilA2);
            elDetail.textContent = `A1 ${detailA1} L · A2 ${detailA2} L`;
        }

        // ─── Lock ───
        function toggleLock(mesin) {
            if (mesin === 'a1') {
                lockA1 = !lockA1;
                elAwalA1.disabled = lockA1;
                elAkhirA1.disabled = lockA1;
                const btn = document.getElementById('lockA1');
                btn.textContent = lockA1 ? '🔓' : '🔒';
                btn.classList.toggle('lock-active', lockA1);
            }

            if (mesin === 'a2') {
                lockA2 = !lockA2;
                elAwalA2.disabled = lockA2;
                elAkhirA2.disabled = lockA2;
                const btn = document.getElementById('lockA2');
                btn.textContent = lockA2 ? '🔓' : '🔒';
                btn.classList.toggle('lock-active', lockA2);
            }

            hitung();
        }

        // ─── Copy ───
        function copyMesin(mesin) {
            let label, awal, akhir;

            if (mesin === 'a1') {
                label = 'Mesin A1';
                awal = elAwalA1.value || '0';
                akhir = elAkhirA1.value || '0';
            } else {
                label = 'Mesin A2';
                awal = elAwalA2.value || '0';
                akhir = elAkhirA2.value || '0';
            }

            const text = `${label}\nTotal Awal  : ${awal}\nTotal Akhir : ${akhir}`;

            navigator.clipboard.writeText(text)
                .then(() => showToast(`✅ Data ${label} disalin`))
                .catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast(`✅ Data ${label} disalin`);
                });
        }

        // ─── Reset ───
        function resetData() {
            // Kosongkan semua input
            elAwalA1.value = '';
            elAkhirA1.value = '';
            elAwalA2.value = '';
            elAkhirA2.value = '';

            // Hitung ulang (akan menampilkan 0)
            hitung();

            // Tampilkan notifikasi
            showToast('↺ Semua totalisator direset');
        }

        // ─── Toast ───
        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.add('show');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2800);
        }

        // ══════════════════════════════════════════════════════
        // ─── SCAN FOTO → ANGKA OTOMATIS (AI Vision) ───
        // Alur: user tekan tombol 📷 di sebelah label input →
        // pilih ambil foto / upload file → gambar dikirim ke
        // model AI (vision) → AI membaca angka pada layar
        // totalisator → hasil angka otomatis mengisi input →
        // hitung() dipanggil ulang.
        // ══════════════════════════════════════════════════════

        function triggerScan(fieldId) {
            const fileInput = document.getElementById(`fileInput-${fieldId}`);
            fileInput.value = ''; // reset agar file sama bisa dipilih ulang
            fileInput.click();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = () => reject(new Error('Gagal membaca file'));
                reader.readAsDataURL(file);
            });
        }

        function setScanning(fieldId, isScanning) {
            const btn = document.getElementById(`scanBtn-${fieldId}`);
            const input = document.getElementById(fieldId);
            if (isScanning) {
                btn.classList.add('scanning');
                btn.textContent = '⏳';
                btn.disabled = true;
                input.disabled = true;
            } else {
                btn.classList.remove('scanning');
                btn.textContent = '📷';
                btn.disabled = false;
                // jangan buka kunci input kalau memang sedang dikunci (lock A1/A2)
                const mesin = fieldId.toLowerCase().includes('a1') ? 'a1' : 'a2';
                const isLocked = mesin === 'a1' ? lockA1 : lockA2;
                input.disabled = isLocked;
            }
        }

        async function handleFotoScan(event, fieldId) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            setScanning(fieldId, true);
            showToast('📷 Membaca angka dari foto...');

            try {
                const base64Data = await fileToBase64(file);
                const mediaType = file.type || 'image/jpeg';

                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-6",
                        max_tokens: 1000,
                        messages: [
                            {
                                role: "user",
                                content: [
                                    {
                                        type: "image",
                                        source: {
                                            type: "base64",
                                            media_type: mediaType,
                                            data: base64Data
                                        }
                                    },
                                    {
                                        type: "text",
                                        text: "Ini adalah foto layar digital totalisator (meteran) pompa BBM SPBU. Baca deretan angka yang tertera pada layar totalisator tersebut (biasanya berupa angka meter, bisa dengan atau tanpa titik/koma desimal). Ambil angka bulat (integer) dari nilai yang terbaca, abaikan digit desimal di belakang koma jika ada. Balas HANYA dengan format JSON murni tanpa teks lain, tanpa markdown code fence, dengan struktur persis seperti ini: {\"angka\": 123456} — jika angka tidak dapat terbaca dengan jelas, balas {\"angka\": null}."
                                    }
                                ]
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                const textBlock = (data.content || []).find(c => c.type === 'text');
                if (!textBlock) throw new Error('Tidak ada respons teks');

                const cleaned = textBlock.text.replace(/```json|```/g, '').trim();
                const parsed = JSON.parse(cleaned);

                if (parsed && parsed.angka !== null && parsed.angka !== undefined && !isNaN(parsed.angka)) {
                    const input = document.getElementById(fieldId);
                    input.value = Math.round(Number(parsed.angka));
                    input.classList.add('just-filled');
                    setTimeout(() => input.classList.remove('just-filled'), 1800);
                    hitung();
                    showToast(`✅ Angka terisi: ${new Intl.NumberFormat('id-ID').format(input.value)}`);
                } else {
                    showToast('⚠️ Angka tidak terbaca jelas, isi manual ya');
                }
            } catch (err) {
                console.error('Scan foto gagal:', err);
                showToast('❌ Gagal membaca foto, coba lagi / isi manual');
            } finally {
                setScanning(fieldId, false);
            }
        }

        // ─── Init ───
        hitung();

        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('change', hitung);
        });
    </script>
